services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hirelly-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - POSTGRES_URL=postgres://hirelly_user:hirelly_pass@postgres:5432/hirelly_db?sslmode=disable
      - BREVO_API_KEY=${BREVO_API_KEY}
      - ADMIN_EMAIL=connect@hirelly.in
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: hirelly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirelly_user
      POSTGRES_PASSWORD: hirelly_pass
      POSTGRES_DB: hirelly_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelly_user -d hirelly_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
